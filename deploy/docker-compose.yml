# Single-server deployment (docs/design/01 §5.2): one Linux host, no Kubernetes.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: dvp
      POSTGRES_PASSWORD: dvp
      POSTGRES_DB: dvp
    volumes:
      - dvp_pg:/var/lib/postgresql/data
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dvp"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports: ["6379:6379"]

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      DVP_PROFILE: server
      DVP_DATABASE_URL: postgresql+psycopg://dvp:dvp@db:5432/dvp
      DVP_SECRET_BACKEND: file
      DVP_RESULT_BACKEND: object
      DVP_IDENTITY_PROVIDER: oidc
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    ports: ["8000:8000"]
    command: ["sh", "-c", "dvp migrate && dvp run"]

volumes:
  dvp_pg:
