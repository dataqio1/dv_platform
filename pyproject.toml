[project]
name = "dv-platform"
version = "0.1.0"
description = "DV Platform — multi-tenant data observability & data testing for Snowflake (Python/PySpark)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "DataQ" }]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "SQLAlchemy>=2.0",
    "alembic>=1.13",
    "structlog>=24.1",
    "typer>=0.12",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
# Each extra maps to a pluggable adapter tier (see docs/design/01-architecture.md §6.1).
snowflake = ["snowflake-connector-python>=3.11", "snowflake-sqlalchemy>=1.6"]
oracle = ["oracledb>=2.2"]
aws = ["boto3>=1.34"]            # S3 file sources
files = ["pyarrow>=14"]          # Parquet file sources
spark = ["pyspark>=3.5"]
pdf = ["reportlab>=4.0"]         # branded PDF report export
ldap = ["ldap3>=2.9"]           # LDAP-group multi-tenancy
server = ["psycopg[binary]>=3.2", "redis>=5.0", "arq>=0.26"]
secrets = ["hvac>=2.3", "keyring>=25.0"]
mcp = ["mcp>=1.2"]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.5",
    "black>=24.4",
    "mypy>=1.10",
    "testcontainers>=4.7",
]

[project.scripts]
dvp = "dvp.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dvp"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
# E501: line length handled by black. UP046: keep Generic[T] form for Pydantic v2
# generic models (PEP 695 class-type-params interact poorly with BaseModel here).
ignore = ["E501", "UP046"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
packages = ["dvp"]
strict = true
# Scaffold: external libs without stubs are allowed to be untyped.
ignore_missing_imports = true
warn_return_any = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
